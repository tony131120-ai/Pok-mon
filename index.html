<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PokéPack Vault Online</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#060914;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:#060914e8;backdrop-filter:blur(14px)}.logo{font-weight:1000;font-size:24px}.logo span{color:#66a9ff;font-size:11px;letter-spacing:2px}.money{font-weight:900;color:#9dceff}.hero,.panel{background:linear-gradient(145deg,#121a2c,#0c111d);border:1px solid #ffffff14;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0006}.hero{margin:12px 0 18px}.hero h1{font-size:clamp(30px,6vw,58px);margin:0}.hero p{color:#aeb8cc}.auth{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px}.auth input{background:#070a12;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:13px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:#69adff;color:#06101f;cursor:pointer}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.tab{background:#ffffff0c;color:#fff;border:1px solid #ffffff14}.tab.active{background:#69adff;color:#06101f}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.pack{padding:10px;background:#0e1523;border:1px solid #ffffff12;border-radius:18px}.packimg{height:230px;border-radius:13px;background:#070a11;display:flex;align-items:center;justify-content:center;overflow:hidden}.packimg img{max-width:100%;max-height:100%;object-fit:contain}.pack h3{margin:9px 3px 3px}.muted{color:#9da8bd;font-size:13px}.price{font-weight:950;color:#91c9ff;margin-top:5px}.pack .btn{width:100%;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.card{background:#0e1523;border:1px solid #ffffff12;border-radius:14px;padding:7px}.card img{width:100%;display:block;border-radius:10px;aspect-ratio:245/337;object-fit:cover;background:#121a2c}.card .btn{width:100%;margin-top:7px;padding:9px}.rank{display:grid;grid-template-columns:45px 1fr auto;gap:10px;padding:13px;border-bottom:1px solid #ffffff0d}.rank b{overflow:hidden;text-overflow:ellipsis}.online{display:flex;flex-wrap:wrap;gap:8px}.player{background:#0e1523;border:1px solid #ffffff12;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#43e27f}.modal{position:fixed;inset:0;background:#02040cf2;z-index:20;display:grid;place-items:center;padding:14px}.modalbox{width:min(560px,100%);height:min(92vh,820px);display:flex;flex-direction:column}.stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}.reveal{position:absolute;width:min(320px,76vw);max-height:74vh;object-fit:contain;border-radius:16px;box-shadow:0 30px 80px #000b;touch-action:none;user-select:none;background:#101827}.bar{height:7px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#69adff}.topline{display:flex;justify-content:space-between;align-items:center}.hidden{display:none!important}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#ffffff10;color:#b8c4d8}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#11182c;padding:11px 16px;border-radius:12px;font-weight:800;display:none;z-index:50}@media(max-width:700px){.auth{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.packimg{height:185px}.hero{padding:18px}.app{padding:10px}}
</style></head><body><div class="app"><div class="head"><div class="logo">⚡ PokéPack <span>VAULT ONLINE</span></div><div><span id="user">게스트</span> · <span id="money" class="money">₩0</span></div></div>
<div id="auth" class="hero"><h1>팩을 열어보자.</h1><p>15,000장 카드 풀 · 30종 팩 · 마지막 카드에만 희귀 슬롯 · 실시간 온라인/랭킹/배틀 신청</p><div class="auth"><input id="name" placeholder="닉네임"><input id="pass" type="password" placeholder="비밀번호"><button class="btn" onclick="signup()">회원가입</button><button class="btn" onclick="login()">로그인</button></div></div>
<div id="main" class="hidden"><div class="tabs"><button class="btn tab active" onclick="tab('packs',this)">팩 상점</button><button class="btn tab" onclick="tab('inventory',this)">내 카드</button><button class="btn tab" onclick="tab('rank',this)">실시간 랭킹</button><button class="btn tab" onclick="tab('online',this)">온라인 <span id="onlineCount">0</span></button><button class="btn tab" onclick="logout()">로그아웃</button></div><section id="packs"></section><section id="inventory" class="hidden"></section><section id="rank" class="hidden"></section><section id="online" class="hidden"></section></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="topline"><b id="mtitle"></b><button class="btn" onclick="finish()">닫기</button></div><div id="stage" class="stage"></div><div id="hint" class="muted" style="text-align:center;padding:8px">↑ 위로 스와이프해서 맨 앞 카드부터 공개</div><div class="bar"><i id="prog"></i></div></div></div><div id="toast" class="toast"></div>
<script>
const money=n=>'₩'+Math.round(Number(n)||0).toLocaleString('ko-KR');let token=localStorage.getItem('pp_token'),me=null,inventory=[],packs=[],cards=[],opening=[],idx=0,onlinePlayers=[],socket=null,busy=false,startY=0;
const $=s=>document.querySelector(s);
async function api(url,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(url,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'요청 실패');return d}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').style.display='none',1800)}
async function signup(){try{const d=await api('/api/signup',{method:'POST',body:JSON.stringify({username:$('#name').value.trim(),password:$('#pass').value})});token=d.token;localStorage.setItem('pp_token',token);await start()}catch(e){toast(e.message)}}
async function login(){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#name').value.trim(),password:$('#pass').value})});token=d.token;localStorage.setItem('pp_token',token);await start()}catch(e){toast(e.message)}}
async function start(){try{const d=await api('/api/me');me=d.user;inventory=d.inventory||[];const p=await api('/api/packs');packs=p.sort((a,b)=>a.price-b.price);$('#auth').classList.add('hidden');$('#main').classList.remove('hidden');refresh();connect();}catch(e){localStorage.removeItem('pp_token');token=null;toast(e.message)}}
function logout(){localStorage.removeItem('pp_token');location.reload()}
function refresh(){$('#user').textContent=me?.username||'게스트';$('#money').textContent=money(me?.cash);renderPacks();renderInv();renderRank();renderOnline()}
function packLogo(p){return `https://assets.tcgdex.net/en/${p.set}/logo.webp`}
function renderPacks(){$('#packs').innerHTML='<div class="grid">'+packs.map(p=>`<article class="pack"><div class="packimg"><img loading="lazy" src="${packLogo(p)}" onerror="this.onerror=null;this.src='https://assets.tcgdex.net/en/${p.set}/logo.webp';"></div><h3>${esc(p.name)}</h3><div class="muted">${p.n}장 · 마지막 슬롯: ${esc(p.chase)}</div><div class="price">${money(p.price)}</div><button class="btn" onclick="openPack(${p.id})">팩 열기</button></article>`).join('')+'</div>'}
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function openPack(id){
  try{
    const d=await api('/api/open',{
      method:'POST',
      body:JSON.stringify({packId:id})
    });

    console.log('팩 개봉 결과:',d);
console.log('첫 카드 데이터:', d.cards[0]);
    me.cash-=d.pack.price;
    opening=d.cards;
    idx=0;
    busy=false;

    $('#mtitle').textContent=d.pack.name;
    $('#modal').classList.remove('hidden');

    renderCard();
  }catch(e){
    console.error('팩 개봉 오류:',e);
    toast(e.message);
  }
}
function imageCandidates(c){
  const b=String(c?.image||'').replace(/\/$/,'');
  if(!b) return [];

  // 이미 확장자가 붙어 있는 URL이면 그대로 사용
  if(/\.(webp|png|jpg|jpeg)$/i.test(b)){
    return [b];
  }

  return [
    `${b}/high.webp`,
    `${b}/high.png`,
    `${b}/low.webp`,
    `${b}/low.png`,
    `${b}/high.jpg`
  ];
}
function renderCard(){const stage=$('#stage');stage.innerHTML='';if(idx>=opening.length){finish();return}const c=opening[idx],im=document.createElement('img');im.className='reveal';im.alt=c.name||'Pokemon Card';im.draggable=false;const urls=imageCandidates(c);let k=0;im.onload=()=>{im.style.background='transparent'};im.onerror=()=>{if(k<urls.length)im.src=urls[k++];else{im.removeAttribute('src');im.alt='';im.style.background='linear-gradient(145deg,#1b2740,#0b1020)';}};if(urls.length)im.src=urls[k++];stage.appendChild(im);$('#prog').style.width=(idx/opening.length*100)+'%';$('#hint').textContent=idx===opening.length-1?'✨ 마지막 카드! 이 카드에서만 좋은 카드가 나올 수 있습니다.':`↑ 위로 스와이프해서 ${idx+1}번째 카드 공개`;
  let y=0;im.onpointerdown=e=>{if(busy)return;y=e.clientY;try{im.setPointerCapture(e.pointerId)}catch(_){}};im.onpointerup=e=>{if(busy)return;if(y-e.clientY>60)nextCard()};
}
async function nextCard(){if(busy)return;busy=true;const im=$('#stage .reveal');if(!im){busy=false;return}im.style.transition='transform .42s ease,opacity .42s';im.style.transform='translateY(-120vh) rotate(-10deg)';im.style.opacity='0';setTimeout(async()=>{idx++;if(idx<opening.length){busy=false;renderCard();return}for(const c of opening){try{const d=await api('/api/claim',{method:'POST',body:JSON.stringify({card:c})});me=d.user}catch(e){console.error(e)}}const d=await api('/api/me');me=d.user;inventory=d.inventory||[];busy=false;refresh();$('#hint').textContent='🎉 모든 카드 공개 완료';$('#prog').style.width='100%'},430)}
function finish(){$('#modal').classList.add('hidden');refresh()}
function renderInv(){$('#inventory').innerHTML='<div class="panel"><h2>내 카드 '+inventory.length+'장</h2><div class="cards">'+inventory.map(c=>`<div class="card"><img loading="lazy" src="${esc(c.image||'')}" onerror="this.onerror=null;this.src=(this.src||'').replace('/high.webp','/low.webp')"><b>${esc(c.card_name)}</b><div class="price">${money(c.price)}</div><button class="btn" onclick="sellCard(${c.id})">판매</button></div>`).join('')+'</div></div>'}
async function sellCard(id){try{const d=await api('/api/sell/'+id,{method:'POST'});me=d.user;const m=await api('/api/me');inventory=m.inventory;refresh()}catch(e){toast(e.message)}}
function tab(id,b){document.querySelectorAll('#main>section').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');}
function renderRank(){if(!window.rankings)return;$('#rank').innerHTML='<div class="panel"><h2>💰 실시간 돈 랭킹</h2>'+window.rankings.map((x,i)=>`<div class="rank"><b>#${i+1}</b><b>${esc(x.username)}</b><strong>${money(x.cash)}</strong></div>`).join('')+'</div>'}
function renderOnline(){$('#onlineCount').textContent=onlinePlayers.length;$('#online').innerHTML='<div class="panel"><h2>🟢 온라인 플레이어 <span class="badge">'+onlinePlayers.length+'명</span></h2><div class="online">'+onlinePlayers.filter(x=>x.username!==me?.username).map(x=>`<div class="player"><i class="dot"></i><b>${esc(x.username)}</b><button class="btn" onclick="battle('${esc(x.username)}')">⚔️ 배틀 신청</button></div>`).join('')+'</div><p class="muted">다른 사람이 온라인 상태일 때 여기에서 바로 배틀을 신청할 수 있습니다.</p></div>'}
function connect(){socket=io();socket.on('connect',()=>socket.emit('auth',token));socket.on('online',p=>{onlinePlayers=p;renderOnline()});socket.on('ranking',r=>{window.rankings=r;renderRank()});socket.on('battle:incoming',d=>{if(confirm(`⚔️ ${d.from}님이 배틀을 신청했습니다.\n수락할까요?`))socket.emit('battle:answer',{to:d.from,accepted:true});else socket.emit('battle:answer',{to:d.from,accepted:false})});socket.on('battle:answer',d=>toast(d.accepted?`⚔️ ${d.from}님이 배틀을 수락했습니다!`:`${d.from}님이 배틀을 거절했습니다.`))}
function battle(username){socket?.emit('battle:request',{to:username});toast(username+'님에게 배틀 신청을 보냈습니다.')}
if(token)start();
</script></body></html>
