<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PokéPack Vault Online</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#060914;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  max-width:1200px;
  margin:auto;
  padding:18px
}

.head{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  background:#060914e8;
  backdrop-filter:blur(14px)
}

.logo{
  font-weight:1000;
  font-size:24px
}

.logo span{
  color:#66a9ff;
  font-size:11px;
  letter-spacing:2px
}

.money{
  font-weight:900;
  color:#9dceff
}

.hero,.panel{
  background:linear-gradient(145deg,#121a2c,#0c111d);
  border:1px solid #ffffff14;
  border-radius:24px;
  padding:24px;
  box-shadow:0 20px 60px #0006
}

.hero{
  margin:12px 0 18px
}

.hero h1{
  font-size:clamp(30px,6vw,58px);
  margin:0
}

.hero p{
  color:#aeb8cc
}

.auth{
  display:grid;
  grid-template-columns:1fr 1fr auto auto;
  gap:10px
}

.auth input{
  background:#070a12;
  color:#fff;
  border:1px solid #ffffff18;
  border-radius:12px;
  padding:13px
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:900;
  background:#69adff;
  color:#06101f
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

.tabs{
  display:flex;
  gap:8px;
  margin:16px 0;
  flex-wrap:wrap
}

.tab{
  background:#ffffff0c;
  color:#fff;
  border:1px solid #ffffff14
}

.tab.active{
  background:#69adff;
  color:#06101f
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px
}

.pack{
  padding:10px;
  background:#0e1523;
  border:1px solid #ffffff12;
  border-radius:18px
}

.packimg{
  height:230px;
  border-radius:13px;
  background:#070a11;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.packimg img{
  max-width:100%;
  max-height:100%;
  object-fit:contain
}

.pack h3{
  margin:9px 3px 3px
}

.muted{
  color:#9da8bd;
  font-size:13px
}

.price{
  font-weight:950;
  color:#91c9ff;
  margin-top:5px
}

.pack .btn{
  width:100%;
  margin-top:8px
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px
}

.card{
  background:#0e1523;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:7px
}

.card img{
  width:100%;
  display:block;
  border-radius:10px;
  aspect-ratio:245/337;
  object-fit:cover;
  background:#121a2c
}

.card .btn{
  width:100%;
  margin-top:7px;
  padding:9px
}

.rank{
  display:grid;
  grid-template-columns:45px 1fr auto;
  gap:10px;
  padding:13px;
  border-bottom:1px solid #ffffff0d
}

.rank b{
  overflow:hidden;
  text-overflow:ellipsis
}

.online{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.player{
  background:#0e1523;
  border:1px solid #ffffff12;
  border-radius:14px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:8px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#43e27f
}

.modal{
  position:fixed;
  inset:0;
  background:#02040cf2;
  z-index:20;
  display:grid;
  place-items:center;
  padding:14px
}

.modalbox{
  width:min(560px,100%);
  height:min(92vh,820px);
  display:flex;
  flex-direction:column
}

.stage{
  flex:1;
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden
}

.reveal{
  position:absolute;
  width:min(320px,76vw);
  max-height:74vh;
  object-fit:contain;
  border-radius:16px;
  box-shadow:0 30px 80px #000b;
  touch-action:none;
  user-select:none;
  background:#101827
}

.bar{
  height:7px;
  background:#ffffff12;
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:#69adff
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.hidden{
  display:none!important
}

.badge{
  font-size:11px;
  padding:4px 7px;
  border-radius:999px;
  background:#ffffff10;
  color:#b8c4d8
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#fff;
  color:#11182c;
  padding:11px 16px;
  border-radius:12px;
  font-weight:800;
  display:none;
  z-index:100
}

/* BATTLE */

.battle-modal{
  position:fixed;
  inset:0;
  z-index:40;
  background:
    radial-gradient(circle at 50% 35%,#1d355d 0,#080c18 48%,#02040a 100%);
  overflow:auto;
  padding:12px
}

.battle-wrap{
  max-width:1250px;
  margin:auto;
  min-height:calc(100vh - 24px);
  display:flex;
  flex-direction:column
}

.battle-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px
}

.battle-title{
  font-size:22px;
  font-weight:1000
}

.battle-board{
  flex:1;
  display:grid;
  grid-template-columns:1fr 170px 1fr;
  gap:12px;
  align-items:center
}

.battle-side{
  min-height:600px;
  background:#ffffff07;
  border:1px solid #ffffff12;
  border-radius:24px;
  padding:16px;
  display:flex;
  flex-direction:column
}

.player-name{
  font-weight:1000;
  font-size:20px;
  text-align:center
}

.hpbox{
  margin-top:8px
}

.hptext{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#b8c4d8
}

.hpbar{
  height:12px;
  background:#ffffff10;
  border-radius:99px;
  overflow:hidden;
  margin-top:4px
}

.hpbar i{
  display:block;
  height:100%;
  background:#54e38b;
  transition:width .4s
}

.active-wrap{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:330px;
  position:relative
}

.active-card{
  width:min(280px,90%);
  position:relative;
  animation:cardIn .45s ease
}

.active-card img{
  width:100%;
  display:block;
  border-radius:15px;
  box-shadow:0 25px 70px #000b
}

.active-card.attack{
  animation:attack .55s ease
}

.active-card.hit{
  animation:hit .45s ease
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(80px) scale(.8) rotate(-5deg)
  }
  to{
    opacity:1;
    transform:none
  }
}

@keyframes attack{
  0%{transform:translateX(0)}
  35%{transform:translateX(90px) scale(1.04)}
  100%{transform:translateX(0)}
}

@keyframes hit{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-18px)}
  40%{transform:translateX(18px)}
  60%{transform:translateX(-12px)}
  80%{transform:translateX(12px)}
}

.damage{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  font-size:48px;
  font-weight:1000;
  color:#ff6678;
  text-shadow:0 5px 20px #000;
  animation:damage .8s ease forwards;
  pointer-events:none
}

@keyframes damage{
  from{
    opacity:0;
    transform:translate(-50%,0) scale(.5)
  }
  35%{
    opacity:1;
    transform:translate(-50%,-30px) scale(1.2)
  }
  to{
    opacity:0;
    transform:translate(-50%,-100px) scale(1)
  }
}

.bench{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:auto
}

.bench-card{
  background:#0a1020;
  border:1px solid #ffffff12;
  border-radius:10px;
  padding:4px;
  position:relative;
  cursor:pointer
}

.bench-card img{
  width:100%;
  display:block;
  border-radius:7px
}

.bench-card.selected{
  outline:3px solid #69adff
}

.bench-card.dead{
  opacity:.25;
  filter:grayscale(1)
}

.card-back{
  aspect-ratio:245/337;
  border-radius:8px;
  background:
    radial-gradient(circle,#284e88 0 10%,transparent 11%),
    linear-gradient(145deg,#182f56,#09101e);
  border:2px solid #69adff;
  display:grid;
  place-items:center;
  font-size:28px;
  cursor:pointer
}

.center-battle{
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
  justify-content:center
}

.turn{
  background:#69adff;
  color:#06101f;
  padding:10px 14px;
  border-radius:999px;
  font-weight:1000;
  text-align:center
}

.battle-log{
  width:100%;
  max-height:180px;
  overflow:auto;
  background:#050914cc;
  border:1px solid #ffffff12;
  border-radius:15px;
  padding:10px;
  font-size:12px
}

.log-line{
  padding:5px 0;
  border-bottom:1px solid #ffffff08
}

.attacks{
  display:grid;
  gap:8px
}

.attack-btn{
  width:100%;
  text-align:left;
  background:#111c31;
  color:#fff;
  border:1px solid #ffffff15;
  border-radius:13px;
  padding:10px;
  transition:.2s
}

.attack-btn:hover{
  background:#1b3153;
  transform:translateY(-2px)
}

.attack-btn:disabled{
  opacity:.35;
  transform:none
}

.attack-name{
  font-weight:1000
}

.attack-damage{
  color:#9dceff;
  font-weight:900
}

.select6{
  background:#0a1020;
  border:1px solid #ffffff15;
  border-radius:20px;
  padding:16px
}

.select6-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;
  max-height:65vh;
  overflow:auto;
  padding:5px
}

.select-card{
  background:#101a2c;
  border:2px solid transparent;
  border-radius:12px;
  padding:5px;
  cursor:pointer
}

.select-card img{
  width:100%;
  display:block;
  border-radius:8px
}

.select-card.selected{
  border-color:#69adff;
  box-shadow:0 0 20px #69adff55
}

.select-card.disabled{
  opacity:.3
}

.battle-overlay{
  position:fixed;
  inset:0;
  z-index:70;
  background:#000b;
  display:grid;
  place-items:center;
  padding:20px
}

.battle-message{
  width:min(500px,100%);
  background:#101a2c;
  border:1px solid #ffffff18;
  border-radius:22px;
  padding:24px;
  text-align:center;
  box-shadow:0 30px 100px #000
}

.big{
  font-size:38px;
  font-weight:1000;
  margin:10px 0
}

@media(max-width:850px){
  .battle-board{
    grid-template-columns:1fr;
  }

  .battle-side{
    min-height:420px
  }

  .center-battle{
    order:2
  }

  .battle-side:first-child{
    order:1
  }

  .battle-side:last-child{
    order:3
  }

  .battle-log{
    max-height:120px
  }
}

@media(max-width:700px){
  .auth{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  .packimg{
    height:185px
  }

  .hero{
    padding:18px
  }

  .app{
    padding:10px
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="head">
    <div class="logo">
      ⚡ PokéPack
      <span>VAULT ONLINE</span>
    </div>

    <div>
      <span id="user">게스트</span>
      ·
      <span id="money" class="money">₩0</span>
    </div>
  </div>

  <div id="auth" class="hero">

    <h1>팩을 열어보자.</h1>

    <p>
      15,000장 카드 풀 · 30종 팩 · 마지막 카드 희귀 슬롯 ·
      실시간 온라인 · 랭킹 · 배틀
    </p>

    <div class="auth">

      <input
        id="name"
        placeholder="닉네임"
      >

      <input
        id="pass"
        type="password"
        placeholder="비밀번호"
      >

      <button
        class="btn"
        onclick="signup()"
      >
        회원가입
      </button>

      <button
        class="btn"
        onclick="login()"
      >
        로그인
      </button>

    </div>

  </div>

  <div id="main" class="hidden">

    <div class="tabs">

      <button
        class="btn tab active"
        onclick="tab('packs',this)"
      >
        팩 상점
      </button>

      <button
        class="btn tab"
        onclick="tab('inventory',this)"
      >
        내 카드
      </button>

      <button
        class="btn tab"
        onclick="tab('rank',this)"
      >
        실시간 랭킹
      </button>

      <button
        class="btn tab"
        onclick="tab('online',this)"
      >
        온라인
        <span id="onlineCount">0</span>
      </button>

      <button
        class="btn tab"
        onclick="logout()"
      >
        로그아웃
      </button>

    </div>

    <section id="packs"></section>

    <section
      id="inventory"
      class="hidden"
    ></section>

    <section
      id="rank"
      class="hidden"
    ></section>

    <section
      id="online"
      class="hidden"
    ></section>

  </div>

</div>

<!-- PACK MODAL -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modalbox">

    <div class="topline">

      <b id="mtitle"></b>

      <button
        class="btn"
        onclick="finish()"
      >
        닫기
      </button>

    </div>

    <div
      id="stage"
      class="stage"
    ></div>

    <div
      id="hint"
      class="muted"
      style="text-align:center;padding:8px"
    >
      ↑ 위로 스와이프해서 카드 공개
    </div>

    <div class="bar">
      <i id="prog"></i>
    </div>

  </div>

</div>

<!-- BATTLE -->

<div
  id="battleModal"
  class="battle-modal hidden"
>

  <div class="battle-wrap">

    <div class="battle-head">

      <div class="battle-title">
        ⚔️ Pokémon Battle
      </div>

      <button
        class="btn"
        onclick="leaveBattle()"
      >
        배틀 나가기
      </button>

    </div>

    <div
      id="battleContent"
      class="battle-board"
    ></div>

  </div>

</div>

<div
  id="toast"
  class="toast"
></div>

<script>
/* =========================================================
   GLOBAL
========================================================= */

const money =
  n =>
    '₩' +
    Math.round(
      Number(n) || 0
    ).toLocaleString('ko-KR');

let token =
  localStorage.getItem(
    'pp_token'
  );

let me = null;
let inventory = [];
let packs = [];
let opening = [];
let idx = 0;
let busy = false;

let onlinePlayers = [];
let rankings = [];
let socket = null;

let battle = null;
let battleSelected = [];
let battleMyDeck = [];
let battleTurn = null;
let battleState = null;

const $ =
  selector =>
    document.querySelector(
      selector
    );

/* =========================================================
   API
========================================================= */

async function api(
  url,
  options = {}
) {
  const headers = {
    'Content-Type':
      'application/json',
    ...(options.headers || {})
  };

  if (token) {
    headers.Authorization =
      'Bearer ' + token;
  }

  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  const data =
    await response
      .json()
      .catch(
        () => ({})
      );

  if (!response.ok) {
    throw new Error(
      data.error ||
      '요청 실패'
    );
  }

  return data;
}

/* =========================================================
   TOAST
========================================================= */

function toast(text) {
  $('#toast')
    .textContent =
    text;

  $('#toast').style.display =
    'block';

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () => {
        $('#toast').style.display =
          'none';
      },
      2200
    );
}

/* =========================================================
   AUTH
========================================================= */

async function signup() {
  try {
    const d =
      await api(
        '/api/signup',
        {
          method:
            'POST',
          body:
            JSON.stringify({
              username:
                $('#name')
                  .value
                  .trim(),
              password:
                $('#pass')
                  .value
            })
        }
      );

    token =
      d.token;

    localStorage.setItem(
      'pp_token',
      token
    );

    await start();

  } catch (e) {
    toast(e.message);
  }
}

async function login() {
  try {
    const d =
      await api(
        '/api/login',
        {
          method:
            'POST',
          body:
            JSON.stringify({
              username:
                $('#name')
                  .value
                  .trim(),
              password:
                $('#pass')
                  .value
            })
        }
      );

    token =
      d.token;

    localStorage.setItem(
      'pp_token',
      token
    );

    await start();

  } catch (e) {
    toast(e.message);
  }
}

async function start() {
  try {
    const d =
      await api(
        '/api/me'
      );

    me =
      d.user;

    inventory =
      d.inventory ||
      [];

    const p =
      await api(
        '/api/packs'
      );

    packs =
      p.sort(
        (a,b) =>
          a.price -
          b.price
      );

    $('#auth')
      .classList
      .add('hidden');

    $('#main')
      .classList
      .remove('hidden');

    refresh();

    connect();

  } catch (e) {

    localStorage.removeItem(
      'pp_token'
    );

    token = null;

    toast(
      e.message
    );
  }
}

function logout() {
  localStorage.removeItem(
    'pp_token'
  );

  location.reload();
}

/* =========================================================
   MAIN RENDER
========================================================= */

function refresh() {

  $('#user')
    .textContent =
    me?.username ||
    '게스트';

  $('#money')
    .textContent =
    money(
      me?.cash
    );

  renderPacks();
  renderInv();
  renderRank();
  renderOnline();
}

function tab(
  id,
  button
) {
  document
    .querySelectorAll(
      '#main>section'
    )
    .forEach(
      section =>
        section
          .classList
          .add('hidden')
    );

  $('#' + id)
    .classList
    .remove('hidden');

  document
    .querySelectorAll(
      '.tab'
    )
    .forEach(
      x =>
        x.classList
          .remove('active')
    );

  if (button) {
    button.classList
      .add('active');
  }
}

/* =========================================================
   PACKS
========================================================= */

function packLogo(p) {
  return `https://assets.tcgdex.net/en/${p.set}/logo.webp`;
}

function renderPacks() {

  $('#packs')
    .innerHTML =
    '<div class="grid">' +
    packs.map(
      p => `
        <article class="pack">

          <div class="packimg">

            <img
              loading="lazy"
              src="${packLogo(p)}"
              onerror="this.onerror=null;this.src='${packLogo(p)}'"
            >

          </div>

          <h3>
            ${esc(p.name)}
          </h3>

          <div class="muted">
            ${p.n}장 · 마지막 슬롯:
            ${esc(p.chase)}
          </div>

          <div class="price">
            ${money(p.price)}
          </div>

          <button
            class="btn"
            onclick="openPack(${p.id})"
          >
            팩 열기
          </button>

        </article>
      `
    ).join('') +
    '</div>';
}

function esc(x) {
  return String(
    x ?? ''
  ).replace(
    /[&<>'"]/g,
    m =>
      ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[m])
  );
}

/* =========================================================
   PACK OPEN
========================================================= */

async function openPack(id) {

  try {

    const d =
      await api(
        '/api/open',
        {
          method:
            'POST',
          body:
            JSON.stringify({
              packId:id
            })
        }
      );

    me.cash -=
      d.pack.price;

    opening =
      d.cards;

    idx = 0;

    busy = false;

    $('#mtitle')
      .textContent =
      d.pack.name;

    $('#modal')
      .classList
      .remove('hidden');

    renderCard();

  } catch (e) {

    toast(
      e.message
    );
  }
}

function imageCandidates(c) {

  const b =
    String(
      c?.image || ''
    ).replace(
      /\/$/,
      ''
    );

  if (!b) {
    return [];
  }

  if (
    /\.(webp|png|jpg|jpeg)$/i
      .test(b)
  ) {
    return [b];
  }

  return [
    `${b}/high.webp`,
    `${b}/high.png`,
    `${b}/low.webp`,
    `${b}/low.png`,
    `${b}/high.jpg`
  ];
}

function renderCard() {

  const stage =
    $('#stage');

  stage.innerHTML =
    '';

  if (
    idx >=
    opening.length
  ) {
    finish();
    return;
  }

  const c =
    opening[idx];

  const image =
    document.createElement(
      'img'
    );

  image.className =
    'reveal';

  image.alt =
    c.name ||
    'Pokemon Card';

  image.draggable =
    false;

  const urls =
    imageCandidates(c);

  let k = 0;

  image.onload =
    () => {
      image.style.background =
        'transparent';
    };

  image.onerror =
    () => {

      if (
        k <
        urls.length
      ) {
        image.src =
          urls[k++];
      } else {
        image.removeAttribute(
          'src'
        );

        image.alt =
          '';

        image.style.background =
          'linear-gradient(145deg,#1b2740,#0b1020)';
      }
    };

  if (urls.length) {
    image.src =
      urls[k++];
  }

  stage.appendChild(
    image
  );

  $('#prog')
    .style.width =
    (
      idx /
      opening.length *
      100
    ) + '%';

  $('#hint')
    .textContent =
    idx ===
    opening.length - 1
      ? '✨ 마지막 카드! 이 카드에서 좋은 카드가 나올 수 있습니다.'
      : `↑ 위로 스와이프해서 ${idx+1}번째 카드 공개`;

  let startY = 0;

  image.onpointerdown =
    e => {

      if (busy)
        return;

      startY =
        e.clientY;

      try {
        image.setPointerCapture(
          e.pointerId
        );
      } catch {}
    };

  image.onpointerup =
    e => {

      if (busy)
        return;

      if (
        startY -
        e.clientY >
        60
      ) {
        nextCard();
      }
    };
}

async function nextCard() {

  if (busy)
    return;

  busy = true;

  const image =
    $('#stage .reveal');

  if (!image) {
    busy = false;
    return;
  }

  image.style.transition =
    'transform .42s ease,opacity .42s';

  image.style.transform =
    'translateY(-120vh) rotate(-10deg)';

  image.style.opacity =
    '0';

  setTimeout(
    async () => {

      idx++;

      if (
        idx <
        opening.length
      ) {
        busy = false;
        renderCard();
        return;
      }

      try {

        for (
          const card
          of opening
        ) {

          try {

            const d =
              await api(
                '/api/claim',
                {
                  method:
                    'POST',
                  body:
                    JSON.stringify({
                      card
                    })
                }
              );

            me =
              d.user;

          } catch (e) {
            console.error(
              e
            );
          }
        }

        const d =
          await api(
            '/api/me'
          );

        me =
          d.user;

        inventory =
          d.inventory ||
          [];

        refresh();

        $('#hint')
          .textContent =
          '🎉 모든 카드 공개 완료';

        $('#prog')
          .style.width =
          '100%';

      } catch (e) {
        console.error(
          e
        );
      }

      busy = false;

    },
    430
  );
}

function finish() {

  $('#modal')
    .classList
    .add('hidden');

  refresh();
}

/* =========================================================
   SOCKET
========================================================= */

function connect() {

  if (socket) {
    socket.disconnect();
  }

  socket =
    io();

  socket.on(
    'connect',
    () => {
      socket.emit(
        'auth',
        token
      );
    }
  );

  socket.on(
    'online',
    players => {

      onlinePlayers =
        players || [];

      renderOnline();
    }
  );

  socket.on(
    'ranking',
    data => {

      rankings =
        data || [];

      renderRank();
    }
  );

  socket.on(
    'toast',
    message => {
      toast(message);
    }
  );

  socket.on(
    'battle:incoming',
    data => {

      const ok =
        confirm(
          `⚔️ ${data.from}님이 배틀을 신청했습니다.\n\n수락할까요?`
        );

      socket.emit(
        'battle:answer',
        {
          to:
            data.from,
          accepted:
            ok
        }
      );
    }
  );

  socket.on(
    'battle:answer',
    data => {

      if (data.accepted) {

        toast(
          `⚔️ ${data.from}님이 배틀을 수락했습니다!`
        );

      } else {

        toast(
          `${data.from}님이 배틀을 거절했습니다.`
        );
      }
    }
  );

  socket.on(
    'battle:started',
    data => {

      battle = {
        id:
          data.battleId
      };

      battleSelected =
        [];

      openBattle();

      showBattleSelect6();
    }
  );

  socket.on(
    'battle:selected',
    () => {

      toast(
        '포켓몬 6장 선택 완료! 상대의 선택을 기다립니다.'
      );
    }
  );

  socket.on(
    'battle:error',
    data => {
      toast(
        data.message
      );
    }
  );

  socket.on(
    'battle:decksReady',
    data => {

      toast(
        '🎴 카드가 섞였습니다. 오른쪽 카드에서 첫 포켓몬을 선택하세요.'
      );

      showBattleDeck();
    }
  );

  socket.on(
    'battle:waiting',
    data => {

      addBattleLog(
        `${data.username}님이 전투 포켓몬을 선택했습니다.`
      );
    }
  );

  socket.on(
    'battle:state',
    data => {

      battleState =
        data;

      battleTurn =
        data.turn;

      renderBattleState();
    }
  );

  socket.on(
    'battle:turn',
    data => {

      battleTurn =
        data.username;

      renderBattleState();

      addBattleLog(
        `⚡ ${data.username}님의 턴입니다.`
      );
    }
  );

  socket.on(
    'battle:attackResult',
    data => {

      playAttackMotion(
        data
      );

      addBattleLog(
        `${data.attacker}의 ${data.attackName} → ${data.damage} 데미지`
      );

      if (
        data.weakness > 1
      ) {
        addBattleLog(
          '🔥 약점 적용 ×2'
        );
      }

      if (
        data.resistance < 0
      ) {
        addBattleLog(
          `🛡️ 저항 ${data.resistance}`
        );
      }
    }
  );

  socket.on(
    'battle:knockout',
    data => {

      playKnockout();

      addBattleLog(
        `💥 ${data.username}님의 ${data.card.name}이(가) 기절했습니다.`
      );
    }
  );

  socket.on(
    'battle:replace',
    data => {

      addBattleLog(
        `🔄 ${data.username}님이 새로운 포켓몬을 선택해야 합니다.`
      );

      showBattleReplace(
        data.username
      );
    }
  );

  socket.on(
    'battle:finished',
    data => {

      showBattleResult(
        data
      );

      battle = null;
      battleState = null;
    }
  );
}

    );

  }

  toast(

}

function showBattleSelect6() {

  $('#battleContent')

    >

      <h2>
        🎴 포켓몬 6장 선택
      </h2>

      <p class="muted">

  renderBattleSelection();

function renderBattleSelection() {

  const grid =
    $('#battleSelectGrid');

  if (!grid)
    return;

  const pokemonCards =
    inventory.filter(
      card =>
        String(
          card.category ||
          ''
        ).toLowerCase() ===
        'pokemon'
    );

  grid.innerHTML =
    pokemonCards.length
      ? pokemonCards.map(
          card => {

            const selected =
              battleSelected.includes(
                Number(card.id)
              );

            return `
              <div
                class="select-card ${
                  selected
                    ? 'selected'
                    : ''
                }"
                onclick="toggleBattleCard(${Number(card.id)})"
              >

                <img
                  src="${esc(card.image || '')}"
                  loading="lazy"
                >

                <div
                  style="font-weight:900;margin-top:4px"
                >
                  ${esc(
                    card.card_name
                  )}
                </div>

                <div class="muted">
                  HP ${Number(card.hp || 0)}
                </div>

              </div>
            `;
          }
        ).join('')
      :
        `
        <p class="muted">
          현재 보유한 포켓몬 카드가 없습니다.
          팩을 열어서 포켓몬 카드를 얻어주세요.
        </p>
        `;

  $('#selectedCount')
    .textContent =
    battleSelected.length;

  $('#sendSix')
    .disabled =
    battleSelected.length !== 6;
}

function toggleBattleCard(id) {

  id =
    Number(id);

  if (
    battleSelected.includes(id)
  ) {

    battleSelected =
      battleSelected.filter(
        x => x !== id
      );

  } else {

    if (
      battleSelected.length >= 6
    ) {
      toast(
        '최대 6장입니다.'
      );
      return;
    }

    battleSelected.push(id);
  }

  renderBattleSelection();
}

function submitSix() {

  if (
    battleSelected.length !== 6
  ) {
    return;
  }

  socket.emit(
    'battle:select6',
    {
      battleId:
        battle.id,
      ids:
        battleSelected
    }
  );
}

      </div>

      <div
        id="battleLog"
        class="battle-log"

        <div class="log-line">
          ⚔️ 배틀을 시작합니다.
        </div>
      </div>

    </div>

    <div class="battle-side">

                    Math.min(
                      100,
                      oppActive.currentHp /

                    )
                  )

          renderOpponentBacks(

        }

function activeCardHtml(
  card,
  mine
) {

  return `
    <div
      id="${
        mine
          ? 'myActiveCard'
          : 'opActiveCard'
      }"
      class="active-card"
    >

      <img
        src="${esc(
          imageForCard(
            card
          )
        )}"
        onerror="fallbackImage(this,'${esc(card.image || '')}')"
      >

    </div>
  `;
}

function renderMyDeck(
  deck,
  activeSlot
) {

  if (!Array.isArray(deck)) {
    return '';
  }

  return deck.map(
    (card,index) => {

      const active =
        index ===
        activeSlot;

      if (active) {
        return `
          <div
            class="bench-card selected"
          >
            <img
              src="${esc(
                imageForCard(card)
              )}"
            >
          </div>
        `;
      }

      return `
        <div
          class="bench-card"
          onclick="deployFromDeck(${index})"
        >
          <img
            src="${esc(
              imageForCard(card)
            )}"
          >
        </div>
      `;
    }
  ).join('');
}

function renderOpponentBacks(
  count
) {

  let html = '';

  for (
    let i = 0;
    i < count;
    i++
  ) {

    html += `
      <div class="bench-card">
        <div class="card-back">
          🎴
        </div>
      </div>
    `;
  }

  return html;
}

function deployFromDeck(
  index
) {

  if (
    !battle
  ) {
    return;
  }

  socket.emit(
    'battle:deploy',
    {
      battleId:
        battle.id,
      slot:
        index
    }
  );
}

function showBattleReplace(
  username
) {

  if (
    !battleState
  ) {
    return;
  }

  if (
    username !==
    me.username
  ) {
    return;
  }

  toast(
    '기절했습니다. 새로운 포켓몬을 선택하세요.'
  );

  renderBattleState();
}

function updateTurnButtonState() {

  const mine =
    battleTurn ===
    me?.username;

  document
    .querySelectorAll(
      '.attack-btn'
    )
    .forEach(
      button => {
        button.disabled =
          !mine;
      }
    );
}

/* =========================================================
   ATTACKS
========================================================= */

function renderAttacks(
  card
) {

  const attacks =
    Array.isArray(
      card.attacks
    )
      ? card.attacks
      : [];

  if (!attacks.length) {
    return `
      <div class="muted">
        사용 가능한 기술이 없습니다.
      </div>
    `;
  }

  return attacks.map(
    (attack,index) => {

      const damage =
        parseClientDamage(
          attack.damage
        );

      return `
        <button
          class="attack-btn"
          onclick="attack(${index})"
          ${damage <= 0 ? 'disabled' : ''}
        >

          <div class="attack-name">
            ${esc(
              attack.name ||
              '기술'
            )}
          </div>

          <div class="attack-damage">
            ${damage > 0
              ? damage + ' 데미지'
              : '공격력 없음'}
          </div>

          ${
            attack.effect
              ? `
                <div class="muted">
                  ${esc(
                    attack.effect
                  )}
                </div>
              `
              : ''
          }

        </button>
      `;
    }
  ).join('');
}

function parseClientDamage(
  value
) {

  if (
    typeof value ===
    'number'
  ) {
    return value;
  }

  const m =
    String(
      value ?? ''
    ).match(
      /\d+/
    );

  return m
    ? Number(m[0])
    : 0;
}

function attack(
  attackIndex
) {

  if (
    !battle ||
    !battleState
  ) {
    return;
  }

  if (
    battleTurn !==
    me.username
  ) {
    toast(
      '상대의 턴입니다.'
    );
    return;
  }

  socket.emit(
    'battle:attack',
    {
      battleId:
        battle.id,
      attackIndex:
        attackIndex
    }
  );
}

/* =========================================================
   MOTIONS
========================================================= */

function playAttackMotion(
  data
) {

  const mine =
    data.attacker ===
    me?.username;

  const attacker =
    mine
      ? $('#myActiveCard')
      : $('#opActiveCard');

  const defender =
    mine
      ? $('#opActiveCard')
      : $('#myActiveCard');

  if (attacker) {
    attacker.classList.remove(
      'attack'
    );

    void attacker.offsetWidth;

    attacker.classList.add(
      'attack'
    );
  }

  setTimeout(
    () => {

      if (defender) {

        defender.classList.remove(
          'hit'
        );

        void defender.offsetWidth;

        defender.classList.add(
          'hit'
        );

        const damage =
          document.createElement(
            'div'
          );

        damage.className =
          'damage';

        damage.textContent =
          '-' +
          data.damage;

        defender.appendChild(
          damage
        );

        setTimeout(
          () =>
            damage.remove(),
          850
        );
      }

      setTimeout(
        () =>
          renderBattleState(),
        550
      );

    },
    350
  );
}

function playKnockout() {

  const card =
    $('#opActiveCard') ||
    $('#myActiveCard');

  if (!card) {
    return;
  }

  card.style.transition =
    'transform .6s,opacity .6s';

  card.style.transform =
    'translateY(120px) rotate(12deg) scale(.5)';

  card.style.opacity =
    '0';
}

/* =========================================================
   BATTLE LOG
========================================================= */

function addBattleLog(
  text
) {

  const log =
    $('#battleLog');

  if (!log) {
    return;
  }

  const line =
    document.createElement(
      'div'
    );

  line.className =
    'log-line';

  line.textContent =
    text;

  log.appendChild(
    line
  );

  log.scrollTop =
    log.scrollHeight;
}

/* =========================================================
   BATTLE RESULT
========================================================= */

function showBattleResult(
  data
) {

  const win =
    data.winner ===
    me?.username;

  const overlay =
    document.createElement(
      'div'
    );

  overlay.className =
    'battle-overlay';

  overlay.innerHTML =
    `
      <div class="battle-message">

        <div class="big">
          ${
            win
              ? '🏆 승리!'
              : '💥 패배'
          }
        </div>

        <p>
          ${
            esc(
              data.winner
            )
          }님이 승리했습니다.
        </p>

        ${
          data.reason
            ? `
              <p class="muted">
                ${esc(
                  data.reason
                )}
              </p>
            `
            : ''
        }

        <button
          class="btn"
          onclick="this.parentElement.parentElement.remove();leaveBattle()"
        >
          확인
        </button>

      </div>
    `;

  document.body.appendChild(
    overlay
  );
}

/* =========================================================
   IMAGE HELPERS
========================================================= */

function imageForCard(
  card
) {

  const b =
    String(
      card?.image ||
      ''
    ).replace(
      /\/$/,
      ''
    );

  if (!b) {
    return '';
  }

  if (
    /\.(webp|png|jpg|jpeg)$/i
      .test(b)
  ) {
    return b;
  }

  return (
    b +
    '/high.webp'
  );
}

function fallbackImage(
  img,
  base
) {

  const b =
    String(
      base || ''
    ).replace(
      /\/$/,
      ''
    );

  const list = [
    `${b}/high.webp`,
    `${b}/high.png`,
    `${b}/low.webp`,
    `${b}/low.png`,
    `${b}/high.jpg`
  ];

  let index =
    list.indexOf(
      img.src
    );

  if (index < 0) {
    index = 0;
  } else {
    index++;
  }

  if (
    index <
    list.length
  ) {
    img.src =
      list[index];
  }
}

/* =========================================================
   AUTO LOGIN
========================================================= */

if (token) {
  start();
}
</script>
