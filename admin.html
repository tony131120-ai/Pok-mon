<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PokéPack Vault 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .sub {
      color: #9fb0c7;
      margin-bottom: 24px;
    }

    #status {
      margin: 15px 0 20px;
      padding: 14px;
      background: #101d30;
      border: 1px solid #263852;
      border-radius: 12px;
      color: #ffd166;
    }

    .user {
      background: #101d30;
      border: 1px solid #263852;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .username {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .info {
      color: #c6d2e2;
      margin: 5px 0;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    input {
      width: 150px;
      background: #081322;
      color: white;
      border: 1px solid #344967;
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }

    input:focus {
      border-color: #5d8dff;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.12);
    }

    .admin {
      background: #35d07f;
      color: #06130b;
    }

    .remove {
      background: #ef5350;
      color: white;
    }

    .money {
      background: #4da3ff;
      color: white;
    }

    .admin-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ffd166;
      color: #211a00;
      font-size: 12px;
      font-weight: bold;
    }

    .normal-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #263852;
      color: #c6d2e2;
      font-size: 12px;
      font-weight: bold;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #9fb0c7;
      background: #101d30;
      border-radius: 14px;
      border: 1px solid #263852;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }

      h1 {
        font-size: 24px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      input,
      button {
        width: 100%;
      }
    }
  </style>

</head>

<div class="wrap">

  <h1>👑 PokéPack Vault 관리자</h1>

  <div class="sub">
    최고 관리자 전용 관리 페이지
  </div>

  <div id="loginBox">

    <div class="login-title">
      🔐 관리자 토큰
    </div>

    <input
      id="adminToken"
      type="password"
      placeholder="관리자 토큰 입력"
      autocomplete="off"
    >

    <button onclick="loginAdmin()">
      관리자 확인
    </button>

    <div id="loginStatus"></div>

  </div>

  <div id="adminPanel" style="display:none;">

    <div id="status">
      관리자 인증 완료
    </div>

    <div id="users"></div>

  </div>

</div>

<script>
  let panelToken = '';

  function setStatus(text) {
    const status =
      document.getElementById('status');

    if (status) {
      status.textContent = text;
    }
  }

  async function loginAdmin() {

    const input =
      document.getElementById('adminToken');

    const loginStatus =
      document.getElementById('loginStatus');

    const value =
      String(input.value || '').trim();

    if (!value) {
      loginStatus.textContent =
        '관리자 토큰을 입력하세요.';
      return;
    }

    loginStatus.textContent =
      '관리자 인증 중...';

    try {

      const response =
        await fetch(
          '/api/admin/panel-login',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({
              token: value
            })
          }
        );

      const data =
        await response.json()
          .catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error ||
          '관리자 인증에 실패했습니다.'
        );
      }

      panelToken = value;

      document.getElementById(
        'loginBox'
      ).style.display = 'none';

      document.getElementById(
        'adminPanel'
      ).style.display = 'block';

      setStatus(
        '👑 최고 관리자 인증 완료'
      );

      await loadUsers();

    } catch (error) {

      console.error(
        'admin login error:',
        error
      );

      loginStatus.textContent =
        error.message ||
        '관리자 인증에 실패했습니다.';
    }
  }


 async function api(url, options = {}) {
  const headers = {
    ...(options.headers || {}),
    'Content-Type': 'application/json',
    'X-Admin-Panel-Token': panelToken
  };

  const response = await fetch(
    url,
    {
      ...options,
      headers
    }
  );

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error ||
      '요청에 실패했습니다.'
    );
  }

  return data;
}

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }


  async function loadUsers() {

    try {

      const data =
      await api('/api/admin/panel/users');

      const users =
        Array.isArray(data.users)
          ? data.users
          : [];

      const box =
        document.getElementById('users');

      if (!users.length) {

        box.innerHTML =
          '<div class="empty">' +
          '관리할 사용자가 없습니다.' +
          '</div>';

        return;
      }

      box.innerHTML =
        users.map(function (u) {

          const isAdmin =
            Boolean(u.is_admin);

          const username =
            escapeHtml(u.username);

          const id =
            Number(u.id);

          const cash =
            Number(u.cash || 0);

          const permissionHtml =
            isAdmin
              ? '<span class="admin-badge">👑 관리자</span>'
              : '<span class="normal-badge">일반 사용자</span>';

          const adminButton =
            isAdmin

              ? '<button class="remove" ' +
                'onclick="setAdmin(' +
                id +
                ', false)">' +
                '🔴 관리자 해제' +
                '</button>'

              : '<button class="admin" ' +
                'onclick="setAdmin(' +
                id +
                ', true)">' +
                '👑 관리자 부여' +
                '</button>';

          return (

            '<div class="user">' +

              '<div class="username">' +
                username +
                permissionHtml +
              '</div>' +

              '<div class="info">' +
                'ID: ' +
                id +
              '</div>' +

              '<div class="info">' +
                '보유금: ' +
                cash.toLocaleString() +
                '원' +
              '</div>' +

              '<div class="info">' +
                '현재 권한: ' +
                (
                  isAdmin
                    ? '👑 관리자'
                    : '일반 사용자'
                ) +
              '</div>' +

              '<div class="actions">' +

                adminButton +

                '<input ' +
                  'id="money-' +
                  id +
                  '" ' +
                  'type="number" ' +
                  'min="1" ' +
                  'placeholder="금액">' +

                '<button ' +
                  'class="money" ' +
                  'onclick="money(' +
                  id +
                  ', \'give\')">' +
                  '💰 돈 지급' +
                '</button>' +

                '<button ' +
                  'class="remove" ' +
                  'onclick="money(' +
                  id +
                  ', \'seize\')">' +
                  '💸 돈 회수' +
                '</button>' +

              '</div>' +

            '</div>'

          );

        }).join('');

    } catch (error) {

      console.error(
        'load users error:',
        error
      );

      setStatus(
        error.message ||
        '사용자 목록을 불러오지 못했습니다.'
      );
    }
  }


  async function setAdmin(
    userId,
    makeAdmin
  ) {

    const message =
      makeAdmin
        ? '이 사용자에게 관리자 권한을 부여할까요?'
        : '이 사용자의 관리자 권한을 해제할까요?';

    if (!confirm(message)) {
      return;
    }

    try {

      await api(
     '/api/admin/panel/set-admin',
        {
          method: 'POST',

          body: JSON.stringify({
            userId: Number(userId),
            makeAdmin: Boolean(makeAdmin)
          })
        }
      );

      setStatus(
        makeAdmin
          ? '👑 관리자 권한을 부여했습니다.'
          : '🔴 관리자 권한을 해제했습니다.'
      );

      await loadUsers();

    } catch (error) {

      setStatus(
        error.message ||
        '관리자 권한 변경에 실패했습니다.'
      );
    }
  }


  async function money(
    userId,
    action
  ) {

    const input =
      document.getElementById(
        'money-' + userId
      );

    if (!input) {
      alert('금액 입력칸을 찾을 수 없습니다.');
      return;
    }

    const amount =
      Math.floor(
        Number(input.value)
      );

    if (
      !Number.isFinite(amount) ||
      amount <= 0
    ) {
      alert('올바른 금액을 입력하세요.');
      return;
    }

    try {

      await api(
     '/api/admin/panel/money',
        {
          method: 'POST',

          body: JSON.stringify({
            userId: Number(userId),
            amount: amount,
            action: action
          })
        }
      );

      setStatus(
        action === 'give'
          ? '💰 돈을 지급했습니다.'
          : '💸 돈을 회수했습니다.'
      );

      await loadUsers();

    } catch (error) {

      setStatus(
        error.message ||
        '돈 처리에 실패했습니다.'
      );
    }
  }
</script>
</body>
</html>
